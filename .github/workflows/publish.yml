name: Release package

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-package
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit and its tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Prepare the release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(node -p "require('./package.json').version")"

          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "package.json contains an invalid release version: $package_version"
            exit 1
          fi

          package_tag="v$package_version"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "$package_tag" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match package.json version $package_version."
              exit 1
            fi

            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git show-ref --verify --quiet "refs/tags/$package_tag"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            echo "$package_tag already exists. Nothing to release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "create_tag=true" >> "$GITHUB_OUTPUT"
            echo "tag=$package_tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.release.outputs.publish == 'true'
        run: npm ci

      - name: Test
        if: steps.release.outputs.publish == 'true'
        run: npm test

      # The scale tests catch a literal where a token exists; the typecheck
      # catches a component that does not compile against its own signature.
      # Both shipped for three versions because neither ran.
      - name: Typecheck
        if: steps.release.outputs.publish == 'true'
        run: npm run typecheck

      # The workshop has to build, or a story that stopped rendering goes
      # unnoticed until somebody opens it.
      - name: Build the workshop
        if: steps.release.outputs.publish == 'true'
        run: npm run build-storybook

      - name: Create and push the version tag
        if: steps.release.outputs.create_tag == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" --message "Release $TAG"
          git push origin "$TAG"

      - name: Publish
        if: steps.release.outputs.publish == 'true'
        run: npm publish --access public
