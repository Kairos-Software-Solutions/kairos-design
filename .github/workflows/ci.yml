# The release workflow runs these same three checks, but it triggers on push to
# main and on tags, so every one of them ran after the merge that broke it. This
# runs them before.
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # A literal where a token exists, a token nothing reads, and a contrast
      # pair below its floor all fail here.
      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      # Compiling the workshop catches a story that stopped rendering.
      - name: Build the workshop
        run: npm run build-storybook

      # Running it catches what axe can see in one, which is a different
      # failure. Chromium only, and only here — `npm test` stays browserless so
      # the loop a person runs on every save stays under a second.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Render every story and check it
        run: npm run test-stories
